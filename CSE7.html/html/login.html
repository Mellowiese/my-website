<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANMADE LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href='https://fonts.googleapis.com' rel='stylesheet'>
    <link rel="stylesheet" href="../css/login.css"/>
</head>

<body>
<section class="vh-100" style="background: linear-gradient(to bottom right, #4a0000, #1a0000);">
  <div class="container-fluid h-100">
    <div class="row h-100">

      <!-- Left Side - Image -->
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="../images/bglogin.png" alt="Login image" class="w-100 vh-100"
          style="object-fit: cover; object-position: center;">
      </div>

      <!-- Right Side - Form -->
      <div class="col-sm-6 d-flex align-items-center justify-content-center right-side">
        <div class="px-5 py-5 pt-3 rounded-4 containerBG">
          
          <!-- Logo -->
          <div class="d-flex flex-column align-items-center justify-content-center text-center mb-2">
            <img src="../images/logo.png" class="logo-img mb-2 mt-3" alt="Logo" style="width: 60px;">
            <h5><span class="text-MAN">MAN</span><span class="text-MADE">MADE</span></h5>
          </div>

          <div class="divider d-flex align-items-center my-1"></div>

          <!-- Error / Success messages -->
          <div id="msg-box"></div>

          <form method="POST" action="../php/login.php">
            <div class="form-outline mb-2 mt-3">
              <label class="form-label text-white mt-1" style="font-family: 'Open Sans', sans-serif; font-size: 0.75rem;" for="email">Email</label>
              <input type="email" id="email" name="email" class="form-control form-control-sm"
                placeholder="Enter Staff Email" required/>
            </div>

            <div class="form-outline mb-2 mt-2">
              <label class="form-label text-white mt-1" style="font-family: 'Open Sans', sans-serif; font-size: 0.75rem;" for="password">Password</label>
              <input type="password" id="password" name="password" class="form-control form-control-sm"
                placeholder="Enter Password" required/>
            </div>

            <div class="text-center mt-3 pt-1">
              <button type="submit" class="buttonLOGIN btn-sm">Login</button>
            </div>
          </form>

          <script>
            // Show error or success from URL params
            const params = new URLSearchParams(window.location.search);
            const box = document.getElementById('msg-box');
            if (params.get('error')) {
              box.innerHTML = `<div style="background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.4);color:#ff9999;border-radius:8px;padding:8px 12px;font-size:0.75rem;margin-bottom:10px;">${params.get('error')}</div>`;
            }
            if (params.get('success')) {
              box.innerHTML = `<div style="background:rgba(39,174,96,0.15);border:1px solid rgba(39,174,96,0.4);color:#7dffaa;border-radius:8px;padding:8px 12px;font-size:0.75rem;margin-bottom:10px;">Account created! You can now log in.</div>`;
            }
          </script>
        </div>
      </div>
    </div>
  </div>
</section>
</body>
</html>
