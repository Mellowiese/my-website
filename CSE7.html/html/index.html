<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANMADE REGISTRATION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href='https://fonts.googleapis.com' rel='stylesheet'>
    <link rel="stylesheet" href="../css/registration.css"/>
</head>

<body>
<section class="vh-100" style="background: linear-gradient(to bottom right, #4a0000, #1a0000);">
  <div class="container-fluid h-100">
    <div class="row h-100">

      <!-- Left Side - Image -->
      <div class="col-sm-6 px-0 d-none d-sm-block">
        <img src="../images/bglogin.png" alt="Login image" class="w-100 vh-100"
          style="object-fit: cover; object-position: center;">
      </div>

      <!-- Right Side - Form -->
      <div class="col-sm-6 d-flex align-items-center justify-content-center right-side">
        <div class="px-5 py-5 pt-3 rounded-4 containerBG">
          
          <!-- Logo -->
          <div class="d-flex flex-column align-items-center justify-content-center text-center mb-2">
            <img src="../images/logo.png" class="logo-img mb-2 mt-3" alt="Logo" style="width: 60px;">
            <h5><span class="text-MAN">MAN</span><span class="text-MADE">MADE</span></h5>
          </div>

          <div class="divider d-flex align-items-center my-1"></div>
                        <form method="POST" action="/register">
                            <div class="mb-3">
                                <label for="username" style="font-family: 'Open Sans', sans-serif; font-size: 0.75rem;" class="form-label text-white">Username</label>
                                <input type="text" class="form-control form-control-sm" id="username" name="username" required placeholder="Create Username">
                            </div>
                            <div class="mb-3">
                                <label for="email" style="font-family: 'Open Sans', sans-serif; font-size: 0.75rem;" class="form-label text-white">Email address</label>
                                <input type="email" class="form-control form-control-sm" id="email" name="email" required placeholder="Enter Valid Email">
                            </div>
                            <div class="mb-3">
                                <label for="password" style="font-family: 'Open Sans', sans-serif; font-size: 0.75rem;" class="form-label text-white">Password</label>
                                <input type="password" class="form-control form-control-sm" id="password" name="password" required placeholder="Create Password">
                            </div>
                            <button type="submit" class="btn buttonLOGIN btn-sm" onclick="window.location.href='login.html'">Register</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
