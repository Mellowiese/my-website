<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="p-4 border rounded bg-white" style="width: 100%; max-width: 400px;">

            <h2 class="mb-4 text-center">Registeration Form</h2>
        <form>
            <div class="mb-3">
                <label for="username" class="form-label">Create Username:</label>
                <input type="text" id="username" name="username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Create Password:</label>
                <input type="password" id="password" name="password" class="form-control">
            </div>
            <div class="mb-4">
                <label for="DobleAtIbigaySaIkalawangTao" class="form-label">
                    Confirm Created Password:
                </label>
                <input type="password"
                       id="DobleAtIbigaySaIkalawangTao"
                       name="DobleAtIbigaySaIkalawangTao"
                       class="form-control">
            </div>
            <button type="button"
            onclick="window.location.href='login.html'"
            class="btn btn-light w-100"> Register   
            </button>
        </form>
    </div>
</body>
</html>
